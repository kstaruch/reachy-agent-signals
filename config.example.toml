# reachy-agent-signals settings — sketch, v1
# macOS:   ~/Library/Application Support/reachy-signals/config.toml
# Windows: %APPDATA%\reachy-signals\config.toml
# The bridge reloads this file on change. Prefer editing it through the CLI.

enabled = true                  # master switch: false = accept events, do nothing

[bridge]
port = 8765                     # localhost only
url = ""                        # clients only: the bridge on another machine, e.g.
                                # "https://<host>.<tailnet>.ts.net:8765" (tailscale serve).
                                # Set → emit/status/try go there, and on/off/quiet/source
                                # change the settings file on that machine. Empty = this one.
daemon_url = "http://127.0.0.1:8000/api"  # not "localhost": see docs/reachy-daemon.md
max_event_age = "10s"           # events older than this when their turn comes are dropped, never replayed

[sources.claude-code]
mode = "drive"                  # drive | shadow | off   (shadow = log only)

[sources.herdr]
mode = "off"                    # planned: start in "shadow"

[quiet]
enabled = false                 # manual toggle
schedule = []                   # local time, e.g. ["22:00-08:00"]; ranges may cross midnight
# What still reacts in quiet mode is set by [quiet.reactions]: an empty list = no reaction.

# Move names from the built-in libraries:
#   pollen-robotics/reachy-mini-emotions-library
#   pollen-robotics/reachy-mini-dances-library
# Several names = random pick. Empty list = no reaction.

[reactions]
started = ["yeah_nod"]
done    = ["cheerful1"]
blocked = ["attentive1"]
missed  = ["curious1"]        # after waking up, when something was missed (presence)

[quiet.reactions]               # used instead of [reactions] while quiet mode is on
started = ["yeah_nod"]          # placeholder: same as normal until silent moves are picked
done    = ["cheerful1"]         # placeholder: has sound
blocked = ["attentive1"]        # placeholder: has sound
missed  = ["curious1"]        # placeholder: sound not checked yet

[escalation]                    # still blocked after this long → play once
blocked_after = "3m"
blocked = ["toc-toc-toc"]

[presence]                      # robot awake only while your phone is at the desk (docs/presence.md)
mode = "off"                    # off | auto | awake | asleep
sleep_after = "2m"              # phone away this long → robot sleeps
missed_events = ["done", "blocked"]  # events that, arriving while asleep, earn a `missed` reaction on wake

[presence.detector]             # read by `reachy-signals presence-watch` on the bridge host only
device = ""                     # the paired phone's Bluetooth address (bluetoothctl devices Paired)
near_rssi = -65                 # median at or above this → near   (≈ 2 m, see docs/presence.md)
far_rssi = -70                  # median at or below this → away   (≈ 3 m)
window = "8s"                   # median over the readings of this long
lost_after = "30s"              # nothing heard from the phone this long → away
