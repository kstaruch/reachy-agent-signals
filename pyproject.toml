[project]
name = "reachy-agent-signals"
version = "0.1.0"
description = "A Reachy Mini robot signals when coding-agent sessions start, finish, or are blocked."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.3",
    "tomlkit>=0.13",
]

[project.scripts]
reachy-signals = "reachy_signals.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "reachy_signals"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["sim: needs the mockup-sim daemon (REACHY_SIGNALS_SIM_URL, default http://127.0.0.1:8001/api)"]
